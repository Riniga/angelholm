[pytest]
addopts = --import-mode=importlib
markers =
    quarantine: flaky test, excluded from the gating run (methodology D1 SKA 3). Must have
        an owner and a fix-or-delete deadline recorded where it's applied — see
        docs/standards/testing.md.
testpaths =
    <path/to/package_1/tests>
    <path/to/package_2/tests>
