# Local pre-commit hooks. Install once: `pre-commit install`.
#
# Ruff is the formatter and linter (ADR-002) — keep the `rev` below on the SAME version as
# `ruff==...` in requirements.in; they must move together.
#
# Scope note: this config enforces what 023-P2 enforces — Python format + lint, plus cheap
# file validators. Repo-wide hygiene (final newlines / trailing whitespace on docs) is a
# separate docs-quality concern, not added here. detect-secrets (023-P7) is the pre-commit
# layer of C4 SKA 1 / F2 SKA 5-6 — see docs/development/secrets-rotation.md and
# docs/methodology-compliance/interpretations.md.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        # Default is 500 KB; MVP-001's committed OpenStreetMap data fixture
        # (apps/simulator/data/angelholm_bbox.osm.xml, ~537 KB as of 2026-09-16) raised
        # this to 600 KB. MVP-003's committed background map image
        # (apps/simulator/data/context-background.png, ~1.7 MB) raised it to 2000 KB, then
        # its Photoshop source (docs/architecture/map.psd, ~5.9 MB, kept as reference
        # material alongside the project owner's other map reference images) raised it
        # again to 6500 KB — all real, reviewed exceptions, raised modestly rather than
        # removed, so this still catches a genuinely oversized accidental commit
        # elsewhere. Note: this hook only checks newly-added files, not size growth in
        # already-tracked ones (confirmed for real when network.net.xml grew past 1 MB on
        # a later bbox change and this hook didn't catch it) — it is not a full safety net
        # against a fixture growing over time.
        args: ['--maxkb=6500']

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
