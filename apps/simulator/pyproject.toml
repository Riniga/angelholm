[project]
name = "simulator"
version = "0.1.0"
description = "First traffic simulation for a small real-world area of Ängelholm (MVP-001) — imports OpenStreetMap data, builds a routable SUMO network, and runs a repeatable simulation."
requires-python = ">=3.13"
# Exact pins, matching requirements.in's reasoning: traci/sumolib are thin Python APIs over
# the eclipse-sumo binaries and must match the engine version they talk to. See ADR-006.
dependencies = [
    "eclipse-sumo==1.27.1",
    "traci==1.27.1",
    "sumolib==1.27.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
